name: CI/CD Pipeline — Booking App

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Backend CI — Install, Migrate, Test
  # ─────────────────────────────────────────────
  backend-test:
    name: Backend Tests (Newman API)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma client
        run: |
          cd backend
          npx prisma generate --schema=prisma/schema.prisma

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_test
        run: |
          cd backend
          npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Seed test data
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_test
        run: |
          cd backend
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const bcrypt = require('bcryptjs');
            const prisma = new PrismaClient();
            async function seed() {
              const hash = await bcrypt.hash('admin123', 10);
              await prisma.user.upsert({
                where: { username: 'admin' },
                update: {},
                create: { username: 'admin', password: hash, role: 'admin' }
              });
              await prisma.room.upsert({
                where: { roomType: 'Standard' },
                update: {},
                create: { name: 'Test Room 101', roomType: 'Standard', description: 'Test room', capacity: 2, price: 1000 }
              });
              console.log('Seed completed');
            }
            seed().catch(console.error).finally(() => prisma.\$disconnect());
          "

      - name: Start backend server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_test
          JWT_SECRET: ci-test-secret-key
          PORT: 3001
          NODE_ENV: test
          FRONTEND_URL: '*'
        run: |
          cd backend
          node server.js &
          echo "Waiting for server..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            sleep 2
          done
          curl -f http://localhost:3001/api/rooms || (echo "Server not ready" && exit 1)

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Newman API Tests
        run: |
          newman run tests/booking-api.postman_collection.json \
            --env-var "baseUrl=http://localhost:3001" \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export newman-results.xml \
            --reporter-htmlextra-export newman-report.html

      - name: Upload Newman test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-test-results
          path: |
            newman-results.xml
            newman-report.html

  # ─────────────────────────────────────────────
  # Job 2: Frontend CI — Install, Build, Lint
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint || true

      - name: Build frontend
        env:
          VITE_API_URL: http://localhost:3001
        run: |
          cd frontend
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/

  # ─────────────────────────────────────────────
  # Job 3: Security Scan
  # ─────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit — Backend
        run: |
          cd backend
          npm ci --quiet
          npm audit --audit-level=high || echo "::warning::Backend has high/critical vulnerabilities"

      - name: npm audit — Frontend
        run: |
          cd frontend
          npm ci --quiet
          npm audit --audit-level=high || echo "::warning::Frontend has high/critical vulnerabilities"

      - name: TruffleHog — Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

  # ─────────────────────────────────────────────
  # Job 4: Deploy Frontend to Vercel
  # (เฉพาะเมื่อ push ไปที่ main เท่านั้น)
  # ─────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel (Production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set — skipping Vercel deployment"
            exit 0
          fi
          cd frontend
          vercel --prod --token "$VERCEL_TOKEN" --yes \
            --build-env VITE_API_URL="$VITE_API_URL"

  # ─────────────────────────────────────────────
  # Job 5: Deploy Backend to Render
  # (เฉพาะเมื่อ push ไปที่ main เท่านั้น)
  # ─────────────────────────────────────────────
  deploy-backend-render:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: [security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deployment
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping Render deployment"
            echo "Set RENDER_DEPLOY_HOOK_URL in GitHub Secrets to enable deployment"
            exit 0
          fi
          curl -f -X POST "$RENDER_HOOK"

      - name: Wait for Render deployment (90s)
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          [ -z "$RENDER_HOOK" ] && exit 0
          sleep 90

      - name: Health check — Backend on Render
        env:
          RENDER_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          [ -z "$RENDER_URL" ] && exit 0
          TIMEOUT=300
          INTERVAL=10
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            echo "Health check attempt... (${ELAPSED}/${TIMEOUT}s)"
            if curl -sf --connect-timeout 5 --max-time 10 "$RENDER_URL/health" > /dev/null 2>&1; then
              echo "Render deployment successful!"
              exit 0
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "Render health check failed after ${TIMEOUT}s"
          exit 1

  # ─────────────────────────────────────────────
  # Job 6: Post-Deploy Smoke Tests
  # ─────────────────────────────────────────────
  post-deploy-smoke-test:
    name: Post-Deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend-render]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deployment secrets
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          FRONTEND_URL: ${{ secrets.VERCEL_FRONTEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$FRONTEND_URL" ]; then
            echo "RENDER_BACKEND_URL or VERCEL_FRONTEND_URL not set — skipping smoke tests"
            exit 0
          fi
          echo "Running smoke tests against $BACKEND_URL"

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Smoke Tests on Production
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          FRONTEND_URL: ${{ secrets.VERCEL_FRONTEND_URL }}
        run: |
          [ -z "$BACKEND_URL" ] && exit 0
          newman run tests/smoke-tests.postman_collection.json \
            --env-var "backendUrl=$BACKEND_URL" \
            --env-var "frontendUrl=$FRONTEND_URL" \
            --reporters cli,junit,htmlextra \
            --reporter-junit-export smoke-results.xml \
            --reporter-htmlextra-export smoke-report.html

      - name: Upload Smoke Test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: |
            smoke-results.xml
            smoke-report.html
