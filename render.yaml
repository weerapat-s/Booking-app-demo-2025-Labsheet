databases:
  - name: booking-app-db
    databaseName: booking_app
    user: booking_user
    region: singapore
    plan: free

services:
  - type: web
    name: booking-app-demo-2025-labsheet
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booking-app-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
